<div class="mx-auto max-w-md">
  <h1>Create your account</h1>
  <p class="mt-2 text-sm text-gray-600 dark:text-gray-300">
    Already have one?
    <a routerLink="/login" class="font-medium text-brand-600 hover:underline dark:text-brand-300">
      Log in
    </a>
  </p>

  <div class="mt-6">
    <app-card>
      <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4" novalidate>
        @if (formError()) {
          <p
            class="rounded-lg bg-danger-600/10 px-3 py-2 text-sm text-danger-700 dark:text-danger-500"
            role="alert"
          >
            {{ formError() }}
          </p>
        }

        <app-form-field label="Name" for="name" [error]="error('name')">
          <input
            id="name"
            type="text"
            formControlName="name"
            autocomplete="name"
            [attr.aria-invalid]="error('name') ? 'true' : null"
            [attr.aria-describedby]="error('name') ? 'name-error' : null"
          />
        </app-form-field>

        <app-form-field
          label="Username"
          for="username"
          [error]="error('username')"
          hint="Lowercase letters, numbers and underscore"
        >
          <input
            id="username"
            type="text"
            formControlName="username"
            autocomplete="username"
            [attr.aria-invalid]="error('username') ? 'true' : null"
            [attr.aria-describedby]="error('username') ? 'username-error' : null"
          />
        </app-form-field>

        <app-form-field label="Email" for="email" [error]="error('email')">
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            [attr.aria-invalid]="error('email') ? 'true' : null"
            [attr.aria-describedby]="error('email') ? 'email-error' : null"
          />
        </app-form-field>

        <app-form-field
          label="Password"
          for="password"
          [error]="error('password')"
          hint="At least 8 characters"
        >
          <div class="relative">
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="new-password"
              class="pr-20"
              [attr.aria-invalid]="error('password') ? 'true' : null"
              [attr.aria-describedby]="error('password') ? 'password-error' : null"
            />
            <button
              type="button"
              class="absolute right-2 top-1/2 -translate-y-1/2 text-xs font-medium text-brand-600 dark:text-brand-300"
              [attr.aria-pressed]="showPassword()"
              (click)="togglePassword()"
            >
              {{ showPassword() ? 'Hide' : 'Show' }}
            </button>
          </div>
        </app-form-field>

        <app-button type="submit" [loading]="submitting()" [full]="true">
          Create account
        </app-button>
      </form>
    </app-card>
  </div>
</div>
