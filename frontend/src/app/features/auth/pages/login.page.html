<div class="mx-auto max-w-md">
  <h1>Log in</h1>
  <p class="mt-2 text-sm text-gray-600 dark:text-gray-300">
    New here?
    <a routerLink="/signup" class="font-medium text-brand-600 hover:underline dark:text-brand-300">
      Create an account
    </a>
  </p>

  <div class="mt-6">
    <app-card>
      <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4" novalidate>
        @if (formError()) {
          <p
            class="rounded-lg bg-danger-600/10 px-3 py-2 text-sm text-danger-700 dark:text-danger-500"
            role="alert"
          >
            {{ formError() }}
          </p>
        }

        <app-form-field label="Username or email" for="identifier" [error]="error('identifier')">
          <input
            id="identifier"
            type="text"
            formControlName="identifier"
            autocomplete="username"
            [attr.aria-invalid]="error('identifier') ? 'true' : null"
            [attr.aria-describedby]="error('identifier') ? 'identifier-error' : null"
          />
        </app-form-field>

        <app-form-field label="Password" for="password" [error]="error('password')">
          <div class="relative">
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="current-password"
              class="pr-20"
              [attr.aria-invalid]="error('password') ? 'true' : null"
              [attr.aria-describedby]="error('password') ? 'password-error' : null"
            />
            <button
              type="button"
              class="absolute right-2 top-1/2 -translate-y-1/2 text-xs font-medium text-brand-600 dark:text-brand-300"
              [attr.aria-pressed]="showPassword()"
              (click)="togglePassword()"
            >
              {{ showPassword() ? 'Hide' : 'Show' }}
            </button>
          </div>
        </app-form-field>

        <label class="flex items-center gap-2 text-sm text-gray-700 dark:text-gray-200">
          <input type="checkbox" formControlName="rememberMe" class="size-4" />
          Keep me logged in
        </label>

        <app-button type="submit" [loading]="submitting()" [full]="true">Log in</app-button>
      </form>
    </app-card>
  </div>
</div>
