<header
  class="sticky top-0 z-40 border-b border-gray-200 bg-white/95 backdrop-blur dark:border-gray-800 dark:bg-gray-900/95"
>
  <nav class="mx-auto flex max-w-6xl items-center gap-4 px-4 py-3" aria-label="Main">
    <a routerLink="/" class="text-lg font-bold tracking-tight text-brand-700 dark:text-brand-300">
      StoryHouse
    </a>

    @if (showSearch()) {
      <div class="ml-auto w-full max-w-xs">
        <label for="global-search" class="sr-only">Search stories</label>
        <input
          #searchBox
          id="global-search"
          type="search"
          placeholder="Search stories…"
          [value]="searchTerm()"
          (input)="onSearchInput(searchBox.value)"
        />
      </div>
    }

    <div class="ml-auto flex items-center gap-2" [class.ml-4]="showSearch()">
      @if (isAuthenticated()) {
        <div class="relative">
          <button
            type="button"
            class="flex size-9 items-center justify-center rounded-full bg-brand-600 text-sm font-semibold text-white"
            [attr.aria-expanded]="menuOpen()"
            aria-haspopup="menu"
            aria-label="Account menu"
            (click)="toggleMenu()"
          >
            {{ initial() }}
          </button>

          @if (menuOpen()) {
            <!-- tabindex="-1": the container is the arrow-key handler; focus
                 lives on the menuitems themselves. -->
            <div
              class="absolute right-0 mt-2 w-44 overflow-hidden rounded-lg border border-gray-200 bg-white shadow-lg dark:border-gray-700 dark:bg-gray-800"
              role="menu"
              tabindex="-1"
              (keydown)="onMenuKeydown($event)"
            >
              <a
                routerLink="/profile"
                routerLinkActive="bg-gray-50 dark:bg-gray-700"
                class="block px-4 py-2 text-sm hover:bg-gray-50 dark:hover:bg-gray-700"
                role="menuitem"
                (click)="closeMenu()"
              >
                Profile
              </a>
              <a
                routerLink="/stories/new"
                class="block px-4 py-2 text-sm hover:bg-gray-50 dark:hover:bg-gray-700"
                role="menuitem"
                (click)="closeMenu()"
              >
                New story
              </a>
              <a
                routerLink="/settings"
                class="block px-4 py-2 text-sm hover:bg-gray-50 dark:hover:bg-gray-700"
                role="menuitem"
                (click)="closeMenu()"
              >
                Settings
              </a>
              @if (isAdmin()) {
                <a
                  routerLink="/admin"
                  class="block px-4 py-2 text-sm hover:bg-gray-50 dark:hover:bg-gray-700"
                  role="menuitem"
                  (click)="closeMenu()"
                >
                  Admin
                </a>
              }
              <button
                type="button"
                class="block w-full px-4 py-2 text-left text-sm text-danger-600 hover:bg-gray-50 dark:hover:bg-gray-700"
                role="menuitem"
                (click)="logout()"
              >
                Log out
              </button>
            </div>
          }
        </div>
      } @else {
        <a
          routerLink="/login"
          class="rounded-lg px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100 dark:text-gray-200 dark:hover:bg-gray-800"
        >
          Log in
        </a>
        <a
          routerLink="/signup"
          class="rounded-lg bg-brand-600 px-3 py-2 text-sm font-medium text-white hover:bg-brand-700"
        >
          Sign up
        </a>
      }
    </div>
  </nav>
</header>
